<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
</head>
<body>
    <h1>Upload CSV or Paste Data</h1>
    <form action="/analyze" method="post" enctype="multipart/form-data">
        <label for="csv_file">Upload CSV file:</label><br>
        <input type="file" id="csv_file" name="csv_file" accept=".csv"><br><br>
        
        <label for="csv_text">Or paste CSV data here:</label><br>
        <textarea id="csv_text" name="csv_text" rows="10" cols="50"></textarea><br><br>
        
        <input type="submit" value="Analyze">
    </form>
</body>
</html>
